<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="contenedor">
        <h1>Actualizar usuario</h1>

        {% if mensaje %}
            <p class="mensaje">{{ mensaje }}</p>
        {% endif %}

        <p id="estado-busqueda" class="mensaje" style="display:none;"></p>

        <form method="POST" action="/usuarios/actualizar" class="formulario">
            <div class="campo">
                <label>Cédula (del usuario a actualizar):</label>
                <input type="text" name="cedula" id="cedula" onblur="buscarUsuario()" required>
            </div>

            <div class="campo">
                <label>Nuevo nombre:</label>
                <input type="text" name="nombre" id="nombre" required>
            </div>

            <div class="campo">
                <label>Nuevo email:</label>
                <input type="email" name="email" id="email" required>
            </div>

            <div class="campo">
                <label>Nueva edad:</label>
                <input type="number" name="edad" id="edad" required>
            </div>

            <button type="submit">Actualizar</button>
        </form>

        <a href="/" class="volver">Volver al inicio</a>
    </div>

    <script>
        async function buscarUsuario() {
            const cedula = document.getElementById('cedula').value.trim();
            const estado = document.getElementById('estado-busqueda');

            if (!cedula) return;

            try {
                const res = await fetch(`/api/usuario/${cedula}`);

                if (!res.ok) {
                    estado.textContent = 'No se encontró un usuario con esa cédula';
                    estado.style.display = 'block';
                    document.getElementById('nombre').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('edad').value = '';
                    return;
                }

                const data = await res.json();
                document.getElementById('nombre').value = data.nombre;
                document.getElementById('email').value = data.email;
                document.getElementById('edad').value = data.edad;

                estado.textContent = 'Datos actuales cargados. Puedes modificarlos abajo.';
                estado.style.display = 'block';
            } catch (error) {
                estado.textContent = 'Error al buscar el usuario';
                estado.style.display = 'block';
            }
        }
    </script>
</body>
</html>
