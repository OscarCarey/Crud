<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Usuario</title>
</head>
<body>
    <h1>Buscar usuario por cédula</h1>

    <form method="POST" action="/usuarios/buscar">
        <label>Cédula:</label><br>
        <input type="text" name="cedula" required>
        <button type="submit">Buscar</button>
    </form>

    <br>

    {% if buscado %}
        {% if usuario %}
            <table border="1" cellpadding="8">
                <tr>
                    <th>Cédula</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Edad</th>
                    <th>Fecha de registro</th>
                </tr>
                <tr>
                    <td>{{ usuario[0] }}</td>
                    <td>{{ usuario[1] }}</td>
                    <td>{{ usuario[2] }}</td>
                    <td>{{ usuario[3] }}</td>
                    <td>{{ usuario[4] }}</td>
                </tr>
            </table>
        {% else %}
            <p><strong>No se encontró ningún usuario con esa cédula.</strong></p>
        {% endif %}
    {% endif %}

    <br>
    <a href="/">Volver al inicio</a>
</body>
</html>
